# Production: Caddy (HTTPS) -> web (Angular SSR) + api (NestJS) + PostgreSQL + MinIO.
#   cp .env.production.example .env   # qiymatlarni to'ldiring
#   docker compose up -d --build
#   docker compose run --rm api node dist-seed/seed.js   # birinchi owner akkaunti
name: taklifnoma

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  caddy:
    image: caddy:2.10-alpine
    <<: [*restart, *logging]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN kerak}
      ACME_EMAIL: ${ACME_EMAIL:-}
      S3_BUCKET: ${S3_BUCKET:-taklifnoma}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: taklifnoma-web:latest
    <<: [*restart, *logging]
    environment:
      API_INTERNAL_ORIGIN: http://api:3000
      # Angular SSR Host sarlavhasini tekshiradi (SSRF himoyasi).
      NG_ALLOWED_HOSTS: ${DOMAIN}
      TRUST_PROXY: "1"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: taklifnoma-api:latest
    <<: [*restart, *logging]
    environment:
      NODE_ENV: production
      PORT: "3000"
      TRUST_PROXY: "1"
      PUBLIC_WEB_URL: https://${DOMAIN}
      CORS_ORIGINS: https://${DOMAIN}
      COOKIE_SECURE: "true"
      DATABASE_URL: postgresql://taklifnoma:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}@postgres:5432/taklifnoma?schema=public
      OWNER_JWT_SECRET: ${OWNER_JWT_SECRET:?OWNER_JWT_SECRET kerak}
      COUPLE_JWT_SECRET: ${COUPLE_JWT_SECRET:?COUPLE_JWT_SECRET kerak}
      RSVP_SECRET: ${RSVP_SECRET:?RSVP_SECRET kerak}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      SEED_DEMO: "false"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-taklifnoma}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY kerak}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY kerak}
      S3_FORCE_PATH_STYLE: "true"
      # Fayllar Caddy orqali shu domenning /media/ yo'lida beriladi.
      S3_PUBLIC_URL: https://${DOMAIN}/media
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_URL: https://${DOMAIN}/api/telegram/webhook
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:17-alpine
    <<: [*restart, *logging]
    environment:
      POSTGRES_USER: taklifnoma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: taklifnoma
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taklifnoma"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    <<: [*restart, *logging]
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER kerak}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD kerak}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Bucket, anonim o'qish ruxsati va ilova uchun alohida (root bo'lmagan) foydalanuvchi.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-taklifnoma}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    entrypoint: >
      /bin/sh -c '
      set -e;
      mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
      mc mb --ignore-existing "local/$$S3_BUCKET";
      mc anonymous set download "local/$$S3_BUCKET";
      mc admin user add local "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY";
      mc admin policy attach local readwrite --user "$$S3_ACCESS_KEY" || true;
      '

volumes:
  pg-data:
  minio-data:
  caddy-data:
  caddy-config:
