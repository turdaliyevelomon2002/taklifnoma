# Lokal ishlab chiqish uchun infratuzilma: PostgreSQL + MinIO (S3-mos).
# Ishga tushirish: npm run dev:infra
name: taklifnoma-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: taklifnoma
      POSTGRES_PASSWORD: taklifnoma
      POSTGRES_DB: taklifnoma
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taklifnoma"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Bucket yaratadi va unga anonim o'qish ruxsatini beradi (rasmlar public URL orqali beriladi).
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/taklifnoma &&
      mc anonymous set download local/taklifnoma
      "

volumes:
  pg-data:
  minio-data:
