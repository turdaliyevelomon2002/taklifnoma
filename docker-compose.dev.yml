# Lokal ishlab chiqish uchun infratuzilma: PostgreSQL + SeaweedFS (S3-mos fayl ombori).
# Ishga tushirish: npm run dev:infra
# (MinIO o'z Docker image'larini ochiq registrlardan olib tashlagani uchun SeaweedFS ishlatiladi.)
name: taklifnoma-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taklifnoma
      POSTGRES_PASSWORD: taklifnoma
      POSTGRES_DB: taklifnoma
    ports:
      - "5434:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taklifnoma"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3 API :8333. Kalitlar apps/api/.env dagi S3_ACCESS_KEY / S3_SECRET_KEY bilan bir xil.
  # Bucket'ni API o'zi yaratadi; fayllarni kalitsiz faqat o'qish mumkin (ro'yxat va yozish yopiq).
  seaweedfs:
    image: chrislusf/seaweedfs:4.55
    restart: unless-stopped
    environment:
      S3_BUCKET: taklifnoma
      S3_ACCESS_KEY: taklifnoma
      S3_SECRET_KEY: taklifnoma-dev-secret
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<JSON
        {"identities":[
          {"name":"app","credentials":[{"accessKey":"$$S3_ACCESS_KEY","secretKey":"$$S3_SECRET_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]},
          {"name":"anonymous","actions":["Read:$$S3_BUCKET"]}
        ]}
        JSON
        exec weed server -dir=/data -volume.max=0 -master.volumeSizeLimitMB=1024 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    ports:
      - "8333:8333"
    volumes:
      - seaweed-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pg-data:
  seaweed-data:
